[project]
site_name = "FigWorks"
site_url = "https://maiani.github.io/figworks/"
site_description = "Assemble publication-quality scientific SVG figures from Matplotlib plots, native SVG elements, annotations, and semantic figure structure."
site_author = "Andrea Maiani"

repo_url = "https://github.com/maiani/figworks"
repo_name = "maiani/figworks"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Usage" = [
      { "Figure, Panel & anchors" = "usage/figure.md" },
      { "Units & sizes" = "usage/units.md" },
      { "Styles" = "usage/styles.md" },
      { "Native SVG elements" = "usage/elements.md" },
      { "Selectors" = "usage/selectors.md" },
      { "Matplotlib integration" = "usage/matplotlib.md" },
      { "3D scenes" = "usage/scenes-3d.md" },
      { "Placeholders & fill" = "usage/placeholders.md" },
      { "Grid layout" = "usage/layout.md" },
      { "Figure collections" = "usage/collections.md" },
      { "Export & display" = "usage/export.md" },
  ] },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
footnotes = {}
toc.permalink = true
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
