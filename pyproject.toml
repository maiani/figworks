[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figforge"
dynamic = ["version"]
description = "A Python framework for building publication-quality scientific SVG figures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Andrea Maiani" },
]
dependencies = [
    "svg.py",
    "lxml",
    "matplotlib",
    "CairoSVG",
    "vectex>=0.1",
]

[project.urls]
Source = "https://github.com/maiani/figforge"
Issues = "https://github.com/maiani/figforge/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "zensical",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "figforge.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
