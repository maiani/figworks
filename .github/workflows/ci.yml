name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test when called by another workflow.
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # 3.15 is tracked before it is supported: until its final release, and
    # until lxml, numpy and PyYAML ship wheels for it, it may fail without
    # failing the run.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # PDF and PNG export refuse to substitute a missing font, so the render
      # tests need the real ones, and fontconfig to find them.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-texgyre fonts-dejavu-core fontconfig libcairo2
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked --python ${{ matrix.python-version }}
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest
      - run: uv run python examples/minimal_svg.py
      - run: uv run python examples/matplotlib_panel.py
      - run: uv run python examples/two_panel_figure.py
      - run: uv run python examples/panel_grid.py
      # VecView and VecWire are optional, so the tests above skip them.  Here
      # they come from their public main branches, to test the
      # to_svg_document() contract against what each producer actually ships.
      - run: >-
          uv pip install
          "vecview @ git+https://github.com/maiani/vecview"
          "vecwire @ git+https://github.com/maiani/vecwire"
      - run: uv run --no-sync pytest tests/test_vecview.py tests/test_vecwire.py

  tex:
    # VecTeX is the one sibling FigWorks requires, and its tests skip without
    # TeX, so this job installs it. Slow, like VecTeX's own integration job:
    # pushes get it, pull requests the fast checks above.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # dvisvgm is its own package, which texlive-binaries only recommends, and
      # it reads PDF through mutool: the runner's Ghostscript is too new.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fonts-texgyre fonts-dejavu-core fontconfig libcairo2 \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-binaries dvisvgm mupdf-tools
      # The tests skip when a tool is missing, so a broken install would pass.
      - run: |
          status=0
          for tool in pdflatex dvisvgm mutool; do
            if ! command -v "$tool" >/dev/null; then
              echo "::error::$tool is missing; the VecTeX tests would silently skip"
              status=1
            fi
          done
          exit "$status"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked --python 3.14
      - run: uv run pytest tests/test_vectex.py
      # The README figure: every producer at once, through the real toolchain.
      - run: >-
          uv pip install
          "vecview @ git+https://github.com/maiani/vecview"
          "vecwire @ git+https://github.com/maiani/vecwire"
      - run: uv run --no-sync python examples/transmon_figure.py
