[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figforge"
dynamic = ["version"]
description = "A Python framework for building publication-quality scientific SVG figures."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Maiani" },
]
keywords = ["svg", "figures", "matplotlib", "scientific-visualization", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "svg.py",
    "lxml",
    "matplotlib",
    "CairoSVG",
    "vectex>=0.1",
]

[project.urls]
Source = "https://github.com/maiani/figforge"
Issues = "https://github.com/maiani/figforge/issues"

[project.optional-dependencies]
dev = [
    "lxml-stubs>=0.5",
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.12",
    "zensical",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
figforge = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "figforge.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# S314/S320: tests parse SVG this package just generated, not untrusted input.
"tests/**" = ["S101", "S314", "S320"]
"examples/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["figforge"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["svg.*", "cairosvg.*", "vectex.*", "IPython.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
