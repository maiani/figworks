[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figforge"
dynamic = ["version"]
description = "A Python framework for building publication-quality scientific SVG figures."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Maiani" },
]
dependencies = [
    "svg.py",
    "lxml",
    "matplotlib",
    "CairoSVG",
    "vectex>=0.1",
]

[project.urls]
Source = "https://github.com/maiani/figforge"
Issues = "https://github.com/maiani/figforge/issues"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff>=0.12",
    "zensical",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "figforge.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# S314/S320: tests parse SVG this package just generated, not untrusted input.
"tests/**" = ["S101", "S314", "S320"]
"examples/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
