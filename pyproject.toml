[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "figworks"
dynamic = ["version"]
description = "A Python framework for building publication-quality scientific SVG figures."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Andrea Maiani" },
]
keywords = ["svg", "figures", "matplotlib", "scientific-visualization", "publication"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "svg.py",
    "lxml",
    "matplotlib",
    "CairoSVG",
    "PyYAML>=6",
    "vectex>=0.1",
]

[project.urls]
Source = "https://github.com/maiani/figworks"
Issues = "https://github.com/maiani/figworks/issues"

[project.optional-dependencies]
dev = [
    "lxml-stubs>=0.5",
    "ty>=0.0.84",
    "types-PyYAML",
    "pytest>=8",
    "ruff>=0.12",
    "zensical",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
figworks = ["py.typed", "styles/*.md"]

[tool.setuptools.dynamic]
version = { attr = "figworks.__version__" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Keep library signatures annotated; ty checks their types.
extend-select = ["ANN001", "ANN002", "ANN003", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206"]
select = ["B", "E", "F", "I", "N", "RUF", "S", "UP"]
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# S314/S320: tests parse SVG this package just generated, not untrusted input.
"tests/**" = ["ANN", "S101", "S314", "S320"]
"examples/**" = ["ANN", "S101"]

[tool.ty.analysis]
# Notebook display is optional and imported only when requested.
allowed-unresolved-imports = ["IPython.display"]

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
